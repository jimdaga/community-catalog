---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-request-release-from-pr-snapshot-duplicate-releases
  annotations:
    test/assert-task-failure: "run-task"
spec:
  description: |
    Check that the task fails when multiple Releases match the Snapshot
  tasks:
    - name: run-task
      taskRef:
        name: request-release-from-pr-snapshot
      params:
        - name: SNAPSHOT
          value: pr-snapshot-duplicate
        - name: RELEASE_PLAN
          value: dev-plan
